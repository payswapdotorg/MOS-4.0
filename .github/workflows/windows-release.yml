name: Windows build & release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-bundle:
    name: Windows x64 installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Bundle metadata derives from tags; keep full history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pnpm\store
          key: pnpm-store-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-win-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Bundle Windows x64 installer
        run: pnpm bundle:desktop -- --os win --arch x64
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Generate checksums and build info
        shell: pwsh
        run: |
          $dist = "packages/desktop/dist"
          if (-not (Test-Path "$dist")) { throw "dist directory missing: $dist" }
          $sums = Join-Path $dist "SHA256SUMS.txt"
          Remove-Item $sums -ErrorAction SilentlyContinue
          Get-ChildItem $dist -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" -and $_.Name -ne "BUILD-INFO.txt" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii $sums
          }
          Get-Content $sums
          "commit=$(git rev-parse HEAD)" | Out-File -Encoding ascii "$dist/BUILD-INFO.txt"
          "ref=$($env:GITHUB_REF_NAME)" | Out-File -Append -Encoding ascii "$dist/BUILD-INFO.txt"
          "node=$(node --version)" | Out-File -Append -Encoding ascii "$dist/BUILD-INFO.txt"
          "pnpm=$(pnpm --version)" | Out-File -Append -Encoding ascii "$dist/BUILD-INFO.txt"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mos-windows-x64-installer
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.yml
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/SHA256SUMS.txt
            packages/desktop/dist/BUILD-INFO.txt
          if-no-files-found: error

      - name: Create GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = "packages/desktop/dist"
          gh release create "$($env:GITHUB_REF_NAME)" (Get-ChildItem $dist -File | ForEach-Object { $_.FullName }) --title "MOS 4.0 $($env:GITHUB_REF_NAME)" --generate-notes
